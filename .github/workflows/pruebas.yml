name: Pruebas LocalSync

on:
  push:
    branches:
      - main
      - feature/motor-p2p-pruebas
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  pruebas-python:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validar sintaxis JavaScript del panel
        run: node --check src/frontend/js/app.js
      - name: Ejecutar pruebas automatizadas
        run: python -m pytest -v

  laboratorio-docker-dos-nodos:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verificar Docker Compose
        run: docker compose version
      - name: Simular dos Linux y validar transferencias TCP LAN
        run: python simulacion/demo.py --cleanup-after
      - name: Probar sincronizacion automatica bidireccional entre Linux
        run: python simulacion/demo_autosync.py --cleanup-after
      - name: Instalar dependencias del panel FastAPI
        run: python -m pip install -r requirements.txt
      - name: Probar boton de simulacion desde la API real
        env:
          LOCALSYNC_DOCKER_E2E: "1"
        run: python -m pytest -v pruebas/test_panel_simulacion_docker.py

  navegador-gui:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias de aplicación y Playwright
        run: |
          python -m pip install -r requirements.txt playwright
          if command -v google-chrome >/dev/null 2>&1; then
            echo "LOCALSYNC_CHROME_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Iniciar FastAPI en localhost
        run: |
          python -m uvicorn src.backend.api.routes:app --host 127.0.0.1 --port 8080 > /tmp/localsync-ui.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/localsync-ui.log
          exit 1
      - name: Validar controles reales desde navegador Chrome
        env:
          LOCALSYNC_BROWSER_E2E: "1"
        run: python -m pytest -v pruebas/test_panel_navegador.py
      - name: Guardar capturas de la interfaz
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localsync-gui-capturas
          path: evidencias_gui/
          if-no-files-found: warn
